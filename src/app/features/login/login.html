<section class="container mt-5" style="max-width: 400px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Login</h3>
            <form [formGroup]="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" required formControlName="email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password" required formControlName="password">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <div class="d-grid mb-3">
                    @if(errorMessage){
                        <div class="alert alert-danger">
                            {{ errorMessage }}
                        </div>
                    }
                    <button class="btn btn-primary" type="button" (click)="login()" [disabled]="loading">
                        Login
                    </button>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="#" class="small">Forgot password?</a>
                    <a routerLink="/signup" class="small">Go to Signup</a>
                </div>
            </form>
        </div>
    </div>
</section>
<app-loading-overlay [isLoading]="loading"></app-loading-overlay>
